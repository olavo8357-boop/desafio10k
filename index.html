    <script>
      // Safe window.fetch getter/setter initialization to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          let currentFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          // fallback if property definition is restricted
        }
      })();
    </script>
